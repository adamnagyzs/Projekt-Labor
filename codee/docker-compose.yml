# Leltárív — fejlesztői adatbázis.
#
# 1. fázis (ez a fájl): PostgreSQL + pgAdmin. Külső fájl nem kell hozzá, azonnal indul.
#    Ezen fut a migráció, a seed és a szerver, AUTH_MODE=local mellett.
# 2. fázis: a Supabase-stack (db, kong, meta, studio, auth, storage). A lépések a SETUP.md-ben;
#    az a compose a Supabase repóból jön, mert a volumes/ alatti konfigurációkat nem írjuk kézzel.
#
# Indítás:  docker compose up -d
#           docker compose --profile szerver up -d --build   (a szerver is konténerben)
# Állapot:  docker compose ps
# Leállás:  docker compose down          (az adat megmarad)
#           docker compose down -v       (az adat is törlődik)

name: leltariv

services:
  db:
    image: postgres:17
    container_name: leltariv-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-leltariv}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leltar2026}
    ports:
      # Csak localhost: a Wi-Fi-ről / hálózatról ne legyen elérhető az adatbázis.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-leltariv}"]
      interval: 5s
      timeout: 5s
      retries: 12

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: leltariv-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@leltariv.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-leltar2026}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      # Csak localhost: desktop módban a pgAdmin nem kér belépést.
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pgadmin-data:/var/lib/pgadmin

  # A szerver konténerben. Profilban van, mert az indító (scripts/start.py, Leltariv.exe)
  # a gazdagépen futtatja a szervert ugyanezen a porton: a kettő közül egyszerre egy fusson.
  server:
    profiles: ["szerver"]
    build: .
    image: leltariv-server
    container_name: leltariv-server
    restart: unless-stopped
    environment:
      # A konténerek hálózatán az adatbázis neve `db`, a portja a belső 5432.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-leltar2026}@db:5432/${POSTGRES_DB:-leltariv}
      AUTH_MODE: ${AUTH_MODE:-local}
      JWT_SECRET: ${JWT_SECRET:-}
      GOTRUE_URL: ${GOTRUE_URL:-}
      SNAPSHOT_DIR: /snapshots
    ports:
      # Csak localhost, mint az adatbázisnál.
      - "127.0.0.1:${SERVER_PORT:-8000}:8000"
    volumes:
      # A pillanatképek a gazdagép codee/snapshots mappájába kerülnek, ugyanoda, ahova a
      # helyben futó szerver is menti őket.
      - ./snapshots:/snapshots
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  pgadmin-data:
