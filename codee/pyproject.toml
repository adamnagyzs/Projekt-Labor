[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pyright>=1.1.380",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-qt>=4.4",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["packages", "scripts", "tests"]
exclude = [
    "**/__pycache__",
    "packages/infrastructure/src/leltariv_infrastructure/migrations",
]
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false

# A Qt-réteg nem tartható strict módban: a signal–slot kapcsolatok és a QAbstractTableModel
# felüldefiniált metódusai a keretrendszer oldalán tipizálatlanok, ezért a pyright minden
# paramétert és visszatérési értéket Unknownnak lát. Az üzleti rétegek (contracts, domain,
# application, infrastructure, server) strict módban maradnak — ott van értéke, mert ott
# a mi típusaink mennek át a határokon.
[[tool.pyright.executionEnvironments]]
root = "packages/client/src"
reportUnknownParameterType = false
reportMissingParameterType = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownLambdaType = false
reportMissingTypeArgument = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
