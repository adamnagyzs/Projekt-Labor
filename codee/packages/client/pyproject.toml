[project]
name = "leltariv-client"
version = "0.1.0"
description = "PySide6 asztali kliens"
requires-python = ">=3.12,<3.13"
dependencies = [
    "leltariv-contracts",
    "PySide6>=6.7",
    "httpx>=0.27",
    "qtawesome>=1.3",
]

[tool.uv.sources]
leltariv-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
